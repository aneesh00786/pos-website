<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThriveWoo POS — Customers Directory</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pos-styles.css">
</head>
<body class="pos-body">

  <header class="pos-header">
    <div class="d-flex align-items-center gap-3">
      <a href="/pos/dashboard" class="pos-brand">
        <div class="pos-brand-icon"><i class="bi bi-cart4"></i></div>
        <div>
          <div class="pos-brand-title">ThriveWoo <span class="pos-brand-badge">POS</span></div>
          <div class="pos-brand-sub">Customer Profiles &amp; Loyalty Ledger</div>
        </div>
      </a>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-success btn-sm fw-bold px-3" data-bs-toggle="modal" data-bs-target="#newCustomerModal">
        <i class="bi bi-person-plus me-1"></i> New Customer
      </button>
      <a href="/pos/sale" class="btn btn-primary btn-sm fw-bold px-3"><i class="bi bi-calculator me-1"></i> Back to Billing</a>
    </div>
  </header>

  <nav class="pos-subnav">
    <a href="/pos/dashboard" class="pos-subnav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/pos/sale" class="pos-subnav-item"><i class="bi bi-calculator"></i> New Sale</a>
    <a href="/pos/held" class="pos-subnav-item"><i class="bi bi-pause-circle"></i> Held Sales</a>
    <a href="/pos/history" class="pos-subnav-item"><i class="bi bi-receipt"></i> Sales History</a>
    <a href="/pos/products" class="pos-subnav-item"><i class="bi bi-box-seam"></i> Products</a>
    <a href="/pos/customers" class="pos-subnav-item active"><i class="bi bi-people"></i> Customers</a>
    <a href="/pos/promotions" class="pos-subnav-item"><i class="bi bi-tag"></i> Promotions</a>
    <a href="/pos/inventory" class="pos-subnav-item"><i class="bi bi-boxes"></i> Inventory</a>
    <a href="/pos/shifts" class="pos-subnav-item"><i class="bi bi-safe"></i> Shifts</a>
    <a href="/pos/reports" class="pos-subnav-item"><i class="bi bi-bar-chart-line"></i> Reports</a>
    <a href="/pos/settings" class="pos-subnav-item"><i class="bi bi-sliders"></i> Settings</a>
  </nav>

  <div class="container-fluid p-4" style="max-width:1300px;">
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
        <h5 class="fw-bold mb-0"><i class="bi bi-people text-primary me-2"></i>Customers Directory</h5>
        <input type="text" id="pos-cust-search" class="form-control form-control-sm w-auto" placeholder="Search customer by name or phone..." oninput="loadCustomers(this.value)">
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small">
              <tr>
                <th>#</th>
                <th>Customer Name</th>
                <th>Code</th>
                <th>Mobile Number</th>
                <th>Email</th>
                <th>Loyalty Points</th>
                <th>Credit Limit</th>
                <th>Balance Outstanding</th>
              </tr>
            </thead>
            <tbody id="pos-customers-tbody" class="small"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- New Customer Modal -->
  <div class="modal fade" id="newCustomerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius:16px;">
        <div class="modal-header border-bottom px-4 py-3">
          <h5 class="modal-title fw-bold"><i class="bi bi-person-plus text-primary me-2"></i>Create Customer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Customer Full Name *</label>
            <input type="text" id="cust-name-input" class="form-control" placeholder="e.g. John Doe" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Mobile Phone Number</label>
            <input type="tel" id="cust-phone-input" class="form-control" placeholder="0400 000 000">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <input type="email" id="cust-email-input" class="form-control" placeholder="john@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Credit Limit ($)</label>
            <input type="number" id="cust-limit-input" class="form-control" value="0.00">
          </div>
        </div>
        <div class="modal-footer border-top px-4 py-3 bg-light">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary fw-bold px-4" onclick="createCustomer()">Save Customer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/pos/pos-utils.js"></script>
  <script src="/js/pos/pos-api.js"></script>
  <script>
    async function loadCustomers(search = '') {
      const res = await PosAPI.getCustomers(search);
      const tbody = document.getElementById('pos-customers-tbody');
      if (!tbody) return;

      if (!res || !res.status || !Array.isArray(res.data) || res.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No customers found.</td></tr>';
        return;
      }

      tbody.innerHTML = res.data.map((c, i) => `
        <tr>
          <td class="fw-bold">${i + 1}</td>
          <td><strong>${c.name}</strong></td>
          <td><span class="badge bg-light text-dark border">${c.code}</span></td>
          <td>${c.phone || 'N/A'}</td>
          <td>${c.email || 'N/A'}</td>
          <td><span class="badge bg-success-subtle text-success">${c.points || 0} pts</span></td>
          <td>${PosUtils.formatCurrency(c.credit_limit || 0)}</td>
          <td class="fw-bold ${(c.outstanding_balance > 0) ? 'text-danger' : 'text-success'}">${PosUtils.formatCurrency(c.outstanding_balance || 0)}</td>
        </tr>
      `).join('');
    }

    async function createCustomer() {
      const name = document.getElementById('cust-name-input').value.trim();
      const phone = document.getElementById('cust-phone-input').value.trim();
      const email = document.getElementById('cust-email-input').value.trim();
      const limit = document.getElementById('cust-limit-input').value;

      if (!name) return alert("Name is required");

      const res = await PosAPI.createCustomer({ name, phone, email, credit_limit: limit });
      if (res && res.status) {
        bootstrap.Modal.getInstance(document.getElementById('newCustomerModal'))?.hide();
        PosUtils.showToast("Customer created!", 'success');
        loadCustomers();
      } else {
        alert(res.message || "Failed to create customer");
      }
    }

    document.addEventListener('DOMContentLoaded', () => loadCustomers());
  </script>
</body>
</html>
