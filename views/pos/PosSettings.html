<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThriveWoo POS — Station & Hardware Settings</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pos-styles.css">
</head>
<body class="pos-body">

  <header class="pos-header">
    <div class="d-flex align-items-center gap-3">
      <a href="/pos/dashboard" class="pos-brand">
        <div class="pos-brand-icon"><i class="bi bi-cart4"></i></div>
        <div>
          <div class="pos-brand-title">ThriveWoo <span class="pos-brand-badge">POS</span></div>
          <div class="pos-brand-sub">Hardware, Store &amp; Station Configuration</div>
        </div>
      </a>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a href="/pos/sale" class="btn btn-primary btn-sm fw-bold px-3"><i class="bi bi-calculator me-1"></i> Back to Billing</a>
    </div>
  </header>

  <nav class="pos-subnav">
    <a href="/pos/dashboard" class="pos-subnav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/pos/sale" class="pos-subnav-item"><i class="bi bi-calculator"></i> New Sale</a>
    <a href="/pos/held" class="pos-subnav-item"><i class="bi bi-pause-circle"></i> Held Sales</a>
    <a href="/pos/history" class="pos-subnav-item"><i class="bi bi-receipt"></i> Sales History</a>
    <a href="/pos/products" class="pos-subnav-item"><i class="bi bi-box-seam"></i> Products</a>
    <a href="/pos/customers" class="pos-subnav-item"><i class="bi bi-people"></i> Customers</a>
    <a href="/pos/promotions" class="pos-subnav-item"><i class="bi bi-tag"></i> Promotions</a>
    <a href="/pos/inventory" class="pos-subnav-item"><i class="bi bi-boxes"></i> Inventory</a>
    <a href="/pos/shifts" class="pos-subnav-item"><i class="bi bi-safe"></i> Shifts</a>
    <a href="/pos/reports" class="pos-subnav-item"><i class="bi bi-bar-chart-line"></i> Reports</a>
    <a href="/pos/settings" class="pos-subnav-item active"><i class="bi bi-sliders"></i> Settings</a>
  </nav>

  <div class="container-fluid p-4" style="max-width:1000px;">
    
    <div class="card border-0 shadow-sm rounded-3 mb-4">
      <div class="card-header bg-white border-bottom py-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-shop text-primary me-2"></i>Store &amp; Receipt Header Details</h5>
      </div>
      <div class="card-body p-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Store / Business Name</label>
            <input type="text" id="set-store-name" class="form-control" value="ThriveWoo Central Store">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Tax ID / ABN / GSTIN</label>
            <input type="text" id="set-tax-number" class="form-control" value="ABN 88 123 456 789">
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold">Store Address</label>
            <input type="text" id="set-store-address" class="form-control" value="145 Collins Street, Melbourne VIC 3000">
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm rounded-3 mb-4">
      <div class="card-header bg-white border-bottom py-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-printer text-primary me-2"></i>Thermal Receipt Printer Settings</h5>
      </div>
      <div class="card-body p-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Printer Format</label>
            <select id="set-printer-type" class="form-select">
              <option value="thermal_80mm">Standard 80mm ESC/POS Thermal Printer</option>
              <option value="thermal_58mm">Compact 58mm Mobile/Thermal Printer</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Thermal Printer LAN IP (Optional)</label>
            <input type="text" id="set-printer-ip" class="form-control" value="192.168.1.100">
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-outline-secondary btn-sm" onclick="testPrint()">
            <i class="bi bi-printer me-1"></i> Send Test Print Receipt
          </button>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end">
      <button class="btn btn-primary fw-bold px-4" onclick="saveSettings()">Save Settings</button>
    </div>

  </div>

  <script src="/js/pos/pos-utils.js"></script>
  <script src="/js/pos/pos-api.js"></script>
  <script>
    async function loadSettings() {
      const res = await PosAPI.getSettings();
      if (res && res.status && res.data) {
        const s = res.data;
        if (s.store_name) document.getElementById('set-store-name').value = s.store_name;
        if (s.tax_number) document.getElementById('set-tax-number').value = s.tax_number;
        if (s.store_address) document.getElementById('set-store-address').value = s.store_address;
        if (s.printer_type) document.getElementById('set-printer-type').value = s.printer_type;
        if (s.printer_lan_ip) document.getElementById('set-printer-ip').value = s.printer_lan_ip;
      }
    }

    async function saveSettings() {
      const payload = {
        store_name: document.getElementById('set-store-name').value,
        tax_number: document.getElementById('set-tax-number').value,
        store_address: document.getElementById('set-store-address').value,
        printer_type: document.getElementById('set-printer-type').value,
        printer_lan_ip: document.getElementById('set-printer-ip').value
      };
      const res = await PosAPI.updateSettings(payload);
      if (res && res.status) {
        PosUtils.showToast("Settings saved successfully!", 'success');
      }
    }

    async function testPrint() {
      const res = await fetch('/api/pos/printer/test-print', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ printer_type: document.getElementById('set-printer-type').value })
      });
      const data = await res.json();
      if (data.status) {
        PosUtils.showToast(data.message, 'success');
      }
    }

    document.addEventListener('DOMContentLoaded', () => loadSettings());
  </script>
</body>
</html>
