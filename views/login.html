<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ThriveWoo POS Terminal</title>
  <link rel="shortcut icon" href="/img/favicon.png" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #eef2ff;
      --secondary: #0ea5e9;
      --accent: #10b981;
      --dark: #0f172a;
      --slate: #64748b;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --focus: #818cf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--dark);
      background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(14, 165, 233, 0.06) 0%, transparent 45%),
                  var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .login-card {
      background: var(--card);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 36px 32px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #4f46e5, #0ea5e9);
    }

    .login-tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .login-tab {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--slate);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .login-tab.active {
      background: #ffffff;
      color: var(--dark);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14.5px;
      font-family: inherit;
      color: var(--dark);
      transition: all 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
    }
    .alert-error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    /* Keypad Numpad */
    .pin-display {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0 24px 0;
    }
    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      transition: all 0.2s;
    }
    .pin-dot.filled {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
    }

    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 260px;
      margin: 0 auto;
    }
    .num-btn {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 20px;
      font-weight: 700;
      color: var(--dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .num-btn:hover {
      background: #f1f5f9;
      transform: scale(1.05);
    }
    .num-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon"><i class="fas fa-cash-register"></i></div>
      <div class="brand-title">ThriveWoo<strong>POS</strong></div>
      <p style="font-size:14px;color:var(--slate);margin-top:4px;">Sign in to access your register terminal</p>
    </div>

    <div class="login-card">
      <div id="alertBox" class="alert alert-error"></div>

      <!-- Mode Switcher -->
      <div class="login-tabs">
        <button type="button" class="login-tab active" id="tabEmail" onclick="switchLoginMode('email')">
          <i class="bi bi-envelope-fill"></i> Store Owner
        </button>
        <button type="button" class="login-tab" id="tabPin" onclick="switchLoginMode('pin')">
          <i class="bi bi-key-fill"></i> Cashier PIN
        </button>
      </div>

      <!-- 1. Store Owner Login (Email & Password) -->
      <form id="emailLoginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" class="form-control" required placeholder="admin@thrivewoo.com" value="admin@thrivewoo.com">
        </div>
        <div class="form-group">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <label style="margin:0;">Password</label>
            <a href="#" style="font-size:12px;color:var(--primary);text-decoration:none;">Forgot password?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••" value="password123">
        </div>
        <button type="submit" class="btn-login" id="btnEmailLogin">
          <span>Sign In to Dashboard</span> <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <!-- 2. Cashier 4-Digit PIN Unlock -->
      <div id="pinLoginForm" style="display:none;text-align:center;">
        <p style="font-size:13.5px;color:var(--slate);">Enter your 4-digit staff PIN (Default: <strong>1234</strong>)</p>
        <div class="pin-display">
          <div class="pin-dot" id="dot0"></div>
          <div class="pin-dot" id="dot1"></div>
          <div class="pin-dot" id="dot2"></div>
          <div class="pin-dot" id="dot3"></div>
        </div>

        <div class="numpad-grid">
          <button type="button" class="num-btn" onclick="pressPin('1')">1</button>
          <button type="button" class="num-btn" onclick="pressPin('2')">2</button>
          <button type="button" class="num-btn" onclick="pressPin('3')">3</button>
          <button type="button" class="num-btn" onclick="pressPin('4')">4</button>
          <button type="button" class="num-btn" onclick="pressPin('5')">5</button>
          <button type="button" class="num-btn" onclick="pressPin('6')">6</button>
          <button type="button" class="num-btn" onclick="pressPin('7')">7</button>
          <button type="button" class="num-btn" onclick="pressPin('8')">8</button>
          <button type="button" class="num-btn" onclick="pressPin('9')">9</button>
          <button type="button" class="num-btn" onclick="clearPin()" style="font-size:14px;color:#ef4444;"><i class="fas fa-backspace"></i></button>
          <button type="button" class="num-btn" onclick="pressPin('0')">0</button>
          <button type="button" class="num-btn" onclick="submitPin()" style="font-size:14px;color:#10b981;"><i class="fas fa-check"></i></button>
        </div>
      </div>

    </div>

    <!-- Registration Link -->
    <div style="text-align:center;margin-top:24px;font-size:14px;color:var(--slate);">
      Don't have an account yet? <a href="/register" style="color:var(--primary);font-weight:700;text-decoration:none;">Start 14-day free trial &rarr;</a>
    </div>
  </div>

  <script>
    let currentMode = 'email';
    let enteredPin = '';

    function switchLoginMode(mode) {
      currentMode = mode;
      document.getElementById('tabEmail').classList.toggle('active', mode === 'email');
      document.getElementById('tabPin').classList.toggle('active', mode === 'pin');
      document.getElementById('emailLoginForm').style.display = mode === 'email' ? 'block' : 'none';
      document.getElementById('pinLoginForm').style.display = mode === 'pin' ? 'block' : 'none';
      clearAlert();
    }

    function showAlert(msg) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function clearAlert() {
      const box = document.getElementById('alertBox');
      box.style.display = 'none';
    }

    // Email & Password Submit
    document.getElementById('emailLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const btn = document.getElementById('btnEmailLogin');
      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.status) {
          window.location.href = data.redirect || '/pos/dashboard';
        } else {
          showAlert(data.message || 'Invalid email or password.');
        }
      } catch (err) {
        showAlert('Network error signing in. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In to Dashboard</span> <i class="bi bi-arrow-right"></i>';
      }
    });

    // PIN Handlers
    function pressPin(digit) {
      if (enteredPin.length < 4) {
        enteredPin += digit;
        updatePinDots();
        if (enteredPin.length === 4) {
          setTimeout(submitPin, 200);
        }
      }
    }

    function clearPin() {
      enteredPin = '';
      updatePinDots();
      clearAlert();
    }

    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('dot' + i);
        dot.classList.toggle('filled', i < enteredPin.length);
      }
    }

    async function submitPin() {
      if (enteredPin.length !== 4) return;
      clearAlert();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: enteredPin })
        });
        const data = await res.json();

        if (data.status) {
          window.location.href = data.redirect || '/pos/dashboard';
        } else {
          showAlert(data.message || 'Invalid PIN code.');
          clearPin();
        }
      } catch (err) {
        showAlert('Error verifying PIN code.');
        clearPin();
      }
    }
  </script>
</body>
</html>
