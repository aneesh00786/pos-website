<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThriveWoo POS — Inventory Management</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pos-styles.css">
</head>
<body class="pos-body">

  <header class="pos-header">
    <div class="d-flex align-items-center gap-3">
      <a href="/pos/dashboard" class="pos-brand">
        <div class="pos-brand-icon"><i class="bi bi-cart4"></i></div>
        <div>
          <div class="pos-brand-title">ThriveWoo <span class="pos-brand-badge">POS</span></div>
          <div class="pos-brand-sub">Real-Time Inventory &amp; Stock Levels</div>
        </div>
      </a>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a href="/pos/sale" class="btn btn-primary btn-sm fw-bold px-3">
        <i class="bi bi-calculator me-1"></i> Back to Billing
      </a>
    </div>
  </header>

  <nav class="pos-subnav">
    <a href="/pos/dashboard" class="pos-subnav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/pos/sale" class="pos-subnav-item"><i class="bi bi-calculator"></i> New Sale</a>
    <a href="/pos/held" class="pos-subnav-item"><i class="bi bi-pause-circle"></i> Held Sales</a>
    <a href="/pos/history" class="pos-subnav-item"><i class="bi bi-receipt"></i> Sales History</a>
    <a href="/pos/products" class="pos-subnav-item"><i class="bi bi-box-seam"></i> Products</a>
    <a href="/pos/customers" class="pos-subnav-item"><i class="bi bi-people"></i> Customers</a>
    <a href="/pos/promotions" class="pos-subnav-item"><i class="bi bi-tag"></i> Promotions</a>
    <a href="/pos/inventory" class="pos-subnav-item active"><i class="bi bi-boxes"></i> Inventory</a>
    <a href="/pos/shifts" class="pos-subnav-item"><i class="bi bi-safe"></i> Shifts</a>
    <a href="/pos/reports" class="pos-subnav-item"><i class="bi bi-bar-chart-line"></i> Reports</a>
    <a href="/pos/settings" class="pos-subnav-item"><i class="bi bi-sliders"></i> Settings</a>
  </nav>

  <div class="container-fluid p-4" style="max-width:1300px;">
    
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
        <h5 class="fw-bold mb-0"><i class="bi bi-boxes text-primary me-2"></i>Stock Levels &amp; On-Hand Inventory</h5>
        <div>
          <input type="text" id="pos-inv-search" class="form-control form-control-sm d-inline-block w-auto" placeholder="Search SKU or Name..." oninput="loadInventory(this.value)">
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small">
              <tr>
                <th>#</th>
                <th>Product Name</th>
                <th>SKU</th>
                <th>Barcode</th>
                <th>Category</th>
                <th>Retail Price</th>
                <th>Stock On Hand</th>
                <th>Status</th>
                <th class="text-end">Quick Adjust</th>
              </tr>
            </thead>
            <tbody id="pos-inventory-tbody" class="small">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="/js/pos/pos-utils.js"></script>
  <script src="/js/pos/pos-api.js"></script>
  <script>
    async function loadInventory(search = '') {
      const res = await PosAPI.getProducts({ search });
      const tbody = document.getElementById('pos-inventory-tbody');
      if (!tbody) return;

      if (!res || !res.status || !Array.isArray(res.data) || res.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">No inventory records found.</td></tr>';
        return;
      }

      tbody.innerHTML = res.data.map((p, i) => {
        const isOut = p.stock_qty <= 0;
        const isLow = p.stock_qty <= (p.low_stock_threshold || 10);
        let statusBadge = '<span class="badge bg-success-subtle text-success">Optimal</span>';
        if (isOut) statusBadge = '<span class="badge bg-danger-subtle text-danger">Out of Stock</span>';
        else if (isLow) statusBadge = '<span class="badge bg-warning-subtle text-warning">Low Stock</span>';

        return `
          <tr>
            <td class="fw-bold">${i + 1}</td>
            <td><strong>${p.name}</strong></td>
            <td>${p.sku}</td>
            <td><code>${p.barcode || 'N/A'}</code></td>
            <td>${p.category}</td>
            <td class="fw-bold">${PosUtils.formatCurrency(p.price)}</td>
            <td class="fw-bold fs-6 ${isOut ? 'text-danger' : (isLow ? 'text-warning' : 'text-dark')}">${p.stock_qty}</td>
            <td>${statusBadge}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-success py-0 px-2" onclick="quickStockAdd(${p.id})">+10</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function quickStockAdd(productId) {
      const res = await fetch('/api/pos/products/adjust', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product_id: productId, adjustment_type: 'add', quantity: 10 })
      });
      const data = await res.json();
      if (data.status) {
        PosUtils.showToast("Stock added successfully", 'success');
        loadInventory();
      }
    }

    document.addEventListener('DOMContentLoaded', () => loadInventory());
  </script>
</body>
</html>
