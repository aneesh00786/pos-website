<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThriveWoo POS — Promotions & Discounts</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pos-styles.css">
</head>
<body class="pos-body">

  <header class="pos-header">
    <div class="d-flex align-items-center gap-3">
      <a href="/pos/dashboard" class="pos-brand">
        <div class="pos-brand-icon"><i class="bi bi-cart4"></i></div>
        <div>
          <div class="pos-brand-title">ThriveWoo <span class="pos-brand-badge">POS</span></div>
          <div class="pos-brand-sub">Active Promotions &amp; Discount Vouchers</div>
        </div>
      </a>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a href="/pos/sale" class="btn btn-primary btn-sm fw-bold px-3"><i class="bi bi-calculator me-1"></i> Back to Billing</a>
    </div>
  </header>

  <nav class="pos-subnav">
    <a href="/pos/dashboard" class="pos-subnav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/pos/sale" class="pos-subnav-item"><i class="bi bi-calculator"></i> New Sale</a>
    <a href="/pos/held" class="pos-subnav-item"><i class="bi bi-pause-circle"></i> Held Sales</a>
    <a href="/pos/history" class="pos-subnav-item"><i class="bi bi-receipt"></i> Sales History</a>
    <a href="/pos/products" class="pos-subnav-item"><i class="bi bi-box-seam"></i> Products</a>
    <a href="/pos/customers" class="pos-subnav-item"><i class="bi bi-people"></i> Customers</a>
    <a href="/pos/promotions" class="pos-subnav-item active"><i class="bi bi-tag"></i> Promotions</a>
    <a href="/pos/inventory" class="pos-subnav-item"><i class="bi bi-boxes"></i> Inventory</a>
    <a href="/pos/shifts" class="pos-subnav-item"><i class="bi bi-safe"></i> Shifts</a>
    <a href="/pos/reports" class="pos-subnav-item"><i class="bi bi-bar-chart-line"></i> Reports</a>
    <a href="/pos/settings" class="pos-subnav-item"><i class="bi bi-sliders"></i> Settings</a>
  </nav>

  <div class="container-fluid p-4" style="max-width:1100px;">
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-header bg-white border-bottom py-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-tag text-primary me-2"></i>Active Promotional Deals</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small">
              <tr>
                <th>Deal Name</th>
                <th>Coupon Code</th>
                <th>Discount Type</th>
                <th>Value</th>
                <th>Min. Spend</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="pos-promos-tbody" class="small"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/pos/pos-utils.js"></script>
  <script>
    async function loadPromos() {
      const res = await fetch('/api/pos/promotions');
      const data = await res.json();
      const tbody = document.getElementById('pos-promos-tbody');
      if (!tbody) return;

      tbody.innerHTML = (data.data || []).map(p => `
        <tr>
          <td><strong>${p.name}</strong></td>
          <td><span class="badge bg-primary-subtle text-primary border border-primary">${p.code}</span></td>
          <td>${p.type.replace('_', ' ').toUpperCase()}</td>
          <td class="fw-bold text-success">${p.type.includes('percentage') ? p.value + '%' : PosUtils.formatCurrency(p.value)}</td>
          <td>${PosUtils.formatCurrency(p.min_spend || 0)}</td>
          <td><span class="badge bg-success">Active</span></td>
        </tr>
      `).join('');
    }
    document.addEventListener('DOMContentLoaded', () => loadPromos());
  </script>
</body>
</html>
